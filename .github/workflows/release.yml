name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BURN_VERSION: v26.1.0-experimental-4

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: burnup-linux-x86_64
            burn: burn-linux-x86_64.tar.gz
          - os: macos-15-intel
            asset: burnup-macos-x86_64
            burn: burn-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Burn
        run: curl -fsSL "https://github.com/burnlang/burn/releases/download/$BURN_VERSION/${{ matrix.burn }}" | tar -xz -C "$RUNNER_TEMP"
      - name: Build burnup
        run: |
          "$RUNNER_TEMP/burn/bin/burn" build --target native -o "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
