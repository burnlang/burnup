name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: burnup-linux-x86_64
          - os: macos-15-intel
            asset: burnup-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Burn
        run: |
          git clone --depth 1 https://github.com/burnlang/burn "$RUNNER_TEMP/burn"
          cargo build --release --manifest-path "$RUNNER_TEMP/burn/Cargo.toml"
      - name: Build burnup
        run: |
          "$RUNNER_TEMP/burn/target/release/burn" build --target native -o "${{ matrix.asset }}"
          "./${{ matrix.asset }}" version
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
